<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>NovelAI Prompt Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 8px;
      background: #fafafa;
    }

    header {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
      width: 100%;
      box-sizing: border-box;
    }

    /* タブ一覧（横スクロール） */
    #tabs.tabs-scroll {
      flex: 1 1 auto;
      display: flex;
      overflow-x: auto;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .tab-button {
      flex: 0 0 auto;
      min-width: 84px;
      padding: 8px 12px;
      border: none;
      background: #f0f0f0;
      font-size: 13px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .tab-button.active {
      background: #1976d2;
      color: #fff;
      font-weight: 600;
    }

    /* タブ一覧ボタン（右端固定） */
    #tabListBtn.tab-list-btn {
      flex: 0 0 auto;
      padding: 8px 12px;
      background: #e0e0e0;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      white-space: nowrap;
    }

    /* メイン領域 */
    textarea {
      width: 100%;
      height: 120px;
      box-sizing: border-box;
      padding: 8px;
      font-size: 14px;
    }

    .editor-wrapper {
      position: relative;
    }

    /* サジェスト表示エリア */
    .suggestions {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      flex-direction: column;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px;
      z-index: 999;
      max-height: 200px;
      overflow-y: auto;
    }

    .suggestion-btn {
      padding: 6px;
      margin-bottom: 4px;
      background: #f5f5f5;
      border: none;
      border-radius: 4px;
      text-align: left;
    }

    .suggestion-btn:last-child {
      margin-bottom: 0;
    }

    /* モーダル、候補一覧などのスタイルは省略（あなたの現行コードと互換） */
  </style>
</head>
<body>

  <!-- ⭐ 上部タブバー（修正版） -->
  <header>
    <div id="tabs" class="tabs-scroll"></div>
    <button id="tabListBtn" class="tab-list-btn">一覧</button>
  </header>

  <!-- ===============================
       メインビュー
       =============================== -->
  <div id="mainView">

    <h3>ポジティブプロンプト</h3>
    <div class="editor-wrapper">
      <textarea id="editorPos"></textarea>
      <div id="suggestionsPos" class="suggestions"></div>
    </div>
    <button id="copyPosBtn">コピー</button>
    <button id="posClearBtn">クリア</button>
    <button id="posUndoBtn">Undo</button>
    <button id="editWordsBtn">単語編集</button>
    <button id="openCandidatesBtn">候補</button>

    <h3>ネガティブプロンプト</h3>
    <div class="editor-wrapper">
      <textarea id="editorNeg"></textarea>
      <div id="suggestionsNeg" class="suggestions"></div>
    </div>
    <button id="copyNegBtn">コピー</button>
    <button id="negClearBtn">クリア</button>
    <button id="negUndoBtn">Undo</button>
    <button id="editWordsNegBtn">単語編集</button>
    <button id="openCandidatesNegBtn">候補</button>

    <!-- 自動生成された単語チップ -->
    <div id="wordsPos"></div>
    <div id="wordsNeg"></div>
  </div>

  <!-- ===============================
       プリセットビュー
       =============================== -->
  <div id="presetView" style="display:none;">

    <h3>プリセット作成（ポジ）</h3>
    <div class="editor-wrapper">
      <textarea id="presetEditorPos"></textarea>
      <div id="suggestionsPresetPos" class="suggestions"></div>
    </div>
    <button id="presetPosClearBtn">クリア</button>
    <button id="presetPosUndoBtn">Undo</button>
    <button id="presetEditWordsPosBtn">単語編集</button>
    <button id="presetOpenCandidatesPosBtn">候補</button>

    <h3>プリセット作成（ネガ）</h3>
    <div class="editor-wrapper">
      <textarea id="presetEditorNeg"></textarea>
      <div id="suggestionsPresetNeg" class="suggestions"></div>
    </div>
    <button id="presetNegClearBtn">クリア</button>
    <button id="presetNegUndoBtn">Undo</button>
    <button id="presetEditWordsNegBtn">単語編集</button>
    <button id="presetOpenCandidatesNegBtn">候補</button>

    <hr />
    <select id="presetCategorySelect"></select>
    <button id="openPresetCategoryEditBtn">カテゴリ管理</button>
    <button id="presetCreateBtn">追加</button>

  </div>

  <!-- ここに「候補」「タブ編集」「プリセット」「ヘルプ」「バックアップ」のモーダル群 -->
  <!-- （あなたの app.js と既存 HTML ですでにあるため省略） -->

  <script src="app.js"></script>
</body>
</html>
